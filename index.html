<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 股票分析器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- 标题 -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">AI 股票分析器</h1>
            <p class="text-gray-600">输入股票代码，获取实时行情与AI智能分析</p>
        </div>

        <!-- 搜索区域 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex gap-4">
                <input
                    type="text"
                    id="stockInput"
                    placeholder="输入股票代码 (如: AAPL, TSLA, MSFT)"
                    class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 uppercase"
                    onkeypress="if(event.key==='Enter')fetchStock()"
                >
                <button
                    onclick="fetchStock()"
                    id="fetchBtn"
                    class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium"
                >
                    获取行情
                </button>
            </div>
        </div>

        <!-- 加载状态 -->
        <div id="loading" class="hidden text-center py-8">
            <div class="inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full loading"></div>
            <p class="mt-2 text-gray-600" id="loadingText">正在获取数据...</p>
        </div>

        <!-- 错误提示 -->
        <div id="error" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg mb-6"></div>

        <!-- 股票数据显示 -->
        <div id="stockData" class="hidden bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-4" id="stockTitle"></h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-gray-50 p-4 rounded-lg">
                    <p class="text-sm text-gray-600">当前价格</p>
                    <p class="text-2xl font-bold text-gray-800" id="stockPrice"></p>
                </div>
                <div class="bg-gray-50 p-4 rounded-lg">
                    <p class="text-sm text-gray-600">涨跌额</p>
                    <p class="text-2xl font-bold" id="stockChange"></p>
                </div>
                <div class="bg-gray-50 p-4 rounded-lg">
                    <p class="text-sm text-gray-600">涨跌幅</p>
                    <p class="text-2xl font-bold" id="stockChangePercent"></p>
                </div>
                <div class="bg-gray-50 p-4 rounded-lg">
                    <p class="text-sm text-gray-600">成交量</p>
                    <p class="text-2xl font-bold text-gray-800" id="stockVolume"></p>
                </div>
            </div>
            <div class="mt-4 text-sm text-gray-500" id="stockDate"></div>

            <!-- AI分析按钮 -->
            <div class="mt-6 text-center">
                <button
                    onclick="analyzeStock()"
                    id="analyzeBtn"
                    class="px-8 py-3 bg-gradient-to-r from-purple-600 to-blue-600 text-white rounded-lg hover:from-purple-700 hover:to-blue-700 transition-all font-medium text-lg shadow-lg"
                >
                    AI 智能分析
                </button>
            </div>
        </div>

        <!-- AI分析结果 -->
        <div id="analysisResult" class="hidden bg-white rounded-lg shadow-md p-6 mb-6">
            <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                <span class="mr-2">AI 分析结果</span>
                <span class="text-sm font-normal text-gray-500" id="analysisTime"></span>
            </h3>

            <div class="space-y-4">
                <!-- 情绪指标 -->
                <div class="flex gap-4">
                    <div class="flex-1 bg-gray-50 p-4 rounded-lg text-center">
                        <p class="text-sm text-gray-600 mb-1">市场情绪</p>
                        <span id="sentimentBadge" class="inline-block px-4 py-2 rounded-full font-bold text-lg"></span>
                    </div>
                    <div class="flex-1 bg-gray-50 p-4 rounded-lg text-center">
                        <p class="text-sm text-gray-600 mb-1">风险等级</p>
                        <span id="riskBadge" class="inline-block px-4 py-2 rounded-full font-bold text-lg"></span>
                    </div>
                </div>

                <!-- 分析总结 -->
                <div class="bg-blue-50 p-4 rounded-lg">
                    <p class="text-sm text-gray-600 mb-2">分析总结</p>
                    <p class="text-gray-800 leading-relaxed" id="analysisSummary"></p>
                </div>

                <!-- 调试信息 -->
                <div id="debugSection" class="hidden bg-yellow-50 p-4 rounded-lg border border-yellow-200">
                    <p class="text-sm text-gray-600 mb-2">
                        AI 原始响应 (调试用)
                        <span id="parseStatus" class="ml-2 px-2 py-1 rounded text-xs"></span>
                    </p>
                    <pre class="text-xs text-gray-700 whitespace-pre-wrap break-all" id="debugInfo"></pre>
                </div>
            </div>
        </div>

        <!-- 历史记录 -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-gray-800">最近分析记录</h3>
                <button onclick="loadHistory()" class="text-blue-600 hover:text-blue-800 text-sm">
                    刷新
                </button>
            </div>
            <div id="historyList" class="space-y-3">
                <p class="text-gray-500 text-center py-4">暂无记录</p>
            </div>
        </div>
    </div>

    <script>
        let currentStockData = null;
        let currentSymbol = '';

        // 获取股票数据
        async function fetchStock() {
            const input = document.getElementById('stockInput');
            const symbol = input.value.trim().toUpperCase();

            if (!symbol) {
                showError('请输入股票代码');
                return;
            }

            currentSymbol = symbol;
            showLoading(true, '正在获取股票数据...');
            hideError();
            hideAnalysis();

            try {
                const response = await fetch(`/api/stock/${symbol}`);
                const data = await response.json();

                if (!response.ok) {
                    // 优先使用后端返回的友好提示
                    const errorMsg = data.message || data.error || '获取数据失败';
                    throw new Error(errorMsg);
                }

                currentStockData = data;
                displayStockData(data);
            } catch (error) {
                showError(error.message || '获取股票数据失败，请检查股票代码是否正确');
                document.getElementById('stockData').classList.add('hidden');
            } finally {
                showLoading(false);
            }
        }

        // 显示股票数据
        function displayStockData(data) {
            document.getElementById('stockTitle').textContent = `${data.symbol} 股票信息`;
            document.getElementById('stockPrice').textContent = `$${data.price.toFixed(2)}`;
            document.getElementById('stockChange').textContent = `${data.change >= 0 ? '+' : ''}$${data.change.toFixed(2)}`;
            document.getElementById('stockChange').className = `text-2xl font-bold ${data.change >= 0 ? 'text-green-600' : 'text-red-600'}`;
            document.getElementById('stockChangePercent').textContent = data.changePercent;
            document.getElementById('stockChangePercent').className = `text-2xl font-bold ${data.change >= 0 ? 'text-green-600' : 'text-red-600'}`;
            document.getElementById('stockVolume').textContent = data.volume.toLocaleString();
            document.getElementById('stockDate').textContent = `最新交易日: ${data.latestTradingDay}`;

            document.getElementById('stockData').classList.remove('hidden');
        }

        // AI分析
        async function analyzeStock() {
            if (!currentStockData || !currentSymbol) {
                showError('请先获取股票数据');
                return;
            }

            showLoading(true, 'AI正在分析中，请稍候...');
            document.getElementById('analyzeBtn').disabled = true;

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        symbol: currentSymbol,
                        stockData: currentStockData
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || '分析失败');
                }

                displayAnalysis(data.analysis, data.debug);
                loadHistory();
            } catch (error) {
                showError(error.message || 'AI分析失败，请稍后重试');
            } finally {
                showLoading(false);
                document.getElementById('analyzeBtn').disabled = false;
            }
        }

        // 显示分析结果
        function displayAnalysis(analysis, debug) {
            document.getElementById('analysisTime').textContent = new Date().toLocaleString('zh-CN');

            // 显示分析总结
            const summaryEl = document.getElementById('analysisSummary');
            if (analysis.summary && analysis.summary !== 'AI 响应解析失败') {
                summaryEl.textContent = analysis.summary;
                summaryEl.classList.remove('text-red-600');
            } else {
                summaryEl.textContent = 'AI 响应解析失败，请查看下方原始响应';
                summaryEl.classList.add('text-red-600');
            }

            // 情绪标签
            const sentimentEl = document.getElementById('sentimentBadge');
            sentimentEl.textContent = analysis.sentiment || 'Neutral';
            sentimentEl.className = 'inline-block px-4 py-2 rounded-full font-bold text-lg ' + getSentimentClass(analysis.sentiment);

            // 风险标签
            const riskEl = document.getElementById('riskBadge');
            riskEl.textContent = analysis.risk_level || 'Medium';
            riskEl.className = 'inline-block px-4 py-2 rounded-full font-bold text-lg ' + getRiskClass(analysis.risk_level);

            // 显示调试信息（仅在解析失败时显示）
            if (debug && debug.rawResponse && debug.isFallback) {
                document.getElementById('debugInfo').textContent = debug.rawResponse;
                const statusEl = document.getElementById('parseStatus');
                if (debug.parseStatus) {
                    statusEl.textContent = debug.parseStatus;
                    if (debug.isFallback) {
                        statusEl.className = 'ml-2 px-2 py-1 rounded text-xs bg-red-100 text-red-800';
                    } else {
                        statusEl.className = 'ml-2 px-2 py-1 rounded text-xs bg-green-100 text-green-800';
                    }
                }
                document.getElementById('debugSection').classList.remove('hidden');
            }

            document.getElementById('analysisResult').classList.remove('hidden');
        }

        // 获取情绪样式
        function getSentimentClass(sentiment) {
            switch (sentiment.toLowerCase()) {
                case 'bullish': return 'bg-green-100 text-green-800';
                case 'bearish': return 'bg-red-100 text-red-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        // 获取风险样式
        function getRiskClass(risk) {
            switch (risk.toLowerCase()) {
                case 'high': return 'bg-red-100 text-red-800';
                case 'low': return 'bg-green-100 text-green-800';
                default: return 'bg-yellow-100 text-yellow-800';
            }
        }

        // 加载历史记录
        async function loadHistory() {
            try {
                const response = await fetch('/api/history');
                const data = await response.json();

                if (!response.ok) {
                    throw new Error('获取历史记录失败');
                }

                displayHistory(data);
            } catch (error) {
                console.error('加载历史记录失败:', error);
            }
        }

        // 显示历史记录
        function displayHistory(records) {
            const container = document.getElementById('historyList');

            if (!records || records.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-4">暂无记录</p>';
                return;
            }

            container.innerHTML = records.map(record => `
                <div class="border-l-4 ${getSentimentBorder(record.sentiment)} pl-4 py-2 bg-gray-50 rounded">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="font-bold text-gray-800">${record.symbol}</span>
                            <span class="text-sm text-gray-600 ml-2">$${record.price}</span>
                            <span class="inline-block px-2 py-1 rounded text-xs ml-2 ${getSentimentClass(record.sentiment)}">
                                ${record.sentiment}
                            </span>
                            <span class="inline-block px-2 py-1 rounded text-xs ml-1 ${getRiskClass(record.risk_level)}">
                                ${record.risk_level} Risk
                            </span>
                        </div>
                        <span class="text-xs text-gray-500">
                            ${new Date(record.created_at).toLocaleString('zh-CN')}
                        </span>
                    </div>
                    <p class="text-sm text-gray-600 mt-1 line-clamp-2">${record.analysis_summary}</p>
                </div>
            `).join('');
        }

        function getSentimentBorder(sentiment) {
            switch (sentiment.toLowerCase()) {
                case 'bullish': return 'border-green-500';
                case 'bearish': return 'border-red-500';
                default: return 'border-gray-500';
            }
        }

        // 显示/隐藏加载状态
        function showLoading(show, text = '') {
            const loading = document.getElementById('loading');
            const loadingText = document.getElementById('loadingText');

            if (show) {
                loadingText.textContent = text;
                loading.classList.remove('hidden');
            } else {
                loading.classList.add('hidden');
            }
        }

        // 显示错误
        function showError(message) {
            const error = document.getElementById('error');
            error.textContent = message;
            error.classList.remove('hidden');
        }

        // 隐藏错误
        function hideError() {
            document.getElementById('error').classList.add('hidden');
        }

        // 隐藏分析结果
        function hideAnalysis() {
            document.getElementById('analysisResult').classList.add('hidden');
            document.getElementById('debugSection').classList.add('hidden');
        }

        // 页面加载时获取历史记录
        document.addEventListener('DOMContentLoaded', loadHistory);
    </script>
</body>
</html>
